
version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 069068173747.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - echo Building Docker image
      - docker build -t ajith-food-corner:v1 .
      - docker tag ajith-food-corner:v1 069068173747.dkr.ecr.ap-south-1.amazonaws.com/ajith-food-corner:v1
  post_build:
    commands:
      - echo Pushing Docker image to ECR
      - docker push 069068173747.dkr.ecr.ap-south-1.amazonaws.com/ajith-food-corner:v1
